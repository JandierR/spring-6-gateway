spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    gateway:
      routes:
        - id: spring-7-rest-mvc
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/*/**
        - id: spring-6-reactive
          uri: http://localhost:8082
          predicates:
            - Path=/api/v2/*
        - id: spring-6-reactive-mongo
          uri: http://localhost:8083
          predicates:
            - Path=/api/v3/*



